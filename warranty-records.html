<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRCON G.O.D · Warranty Records</title>
    <link rel="icon" href="favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="stylesheet" href="inventory.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="loading.js"></script>
  <script src="roles.js?v=11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="cloud.js?v=16"></script>
</head>
<body class="app">
  <script>if (!sessionStorage.getItem("aircon_user")) location.href = "index.html";</script>

  <!-- Warranty Records: every warranty quotation saved, printed or signed (history.js "aircon_hist_quotation"), with its date. Open puts it back on the Warranty page. -->
  <aside class="side">
    <div class="side-brand"><img src="AIRCON.png" alt="Logo"><span>AIRCON G.O.D</span></div>
    <nav aria-label="Main menu"></nav>
    <button class="out" onclick="logout()">Logout</button>
  </aside>

  <main class="content inv">
    <div class="inv-header">
      <div>
        <h1>Warranty Records</h1>
        <p>Saved, printed and signed warranty quotations.</p>
      </div>
      <div><a class="inv-btn light" href="aftersales.html" style="text-decoration:none"><i class="fas fa-plus"></i> New warranty quotation</a></div>
    </div>
    <div id="records"></div>
  </main>

  <script>
    function logout() { sessionStorage.clear(); window.location.href = "index.html"; }
  </script>
  <script src="sidebar.js?v=20"></script>
  <script src="user.js?v=39"></script>
  <script src="chat.js?v=10"></script>
  <script src="daterange.js?v=3"></script>
  <script src="histrecords.js?v=1"></script>
  <script>
    HistRecords.mount(document.getElementById("records"), { key: "aircon_hist_quotation", page: "aftersales.html", what: "warranty quotation" });
  </script>
</body>
</html>
