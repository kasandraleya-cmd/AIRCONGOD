<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">AIRCON G.O.D Office System Flow</title>
  <desc id="desc">Staff sign in, use the office system's work areas, and synchronize shared operational data through Supabase. The installation form sends requests to Customer Records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f7fa"/><stop offset="1" stop-color="#e8f2f0"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123b67"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#6a8794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#183247}.title{font-size:38px;font-weight:750;letter-spacing:-.6px}.sub{font-size:17px;fill:#617783}.step{font-size:13px;font-weight:750;letter-spacing:1.5px;fill:#0f766e}.cardTitle{font-size:21px;font-weight:700}.body{font-size:15px;fill:#617783}.module{font-size:16px;font-weight:650}.moduleSub{font-size:12.5px;fill:#70838c}.small{font-size:13px;fill:#637983}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1490" cy="100" r="185" fill="#d8eeea" opacity=".55"/>
  <circle cx="90" cy="1080" r="220" fill="#dce9f4" opacity=".5"/>
  <text x="92" y="82" class="step">OFFICE OPERATIONS</text>
  <text x="92" y="132" class="title">AIRCON G.O.D System Flow</text>
  <text x="92" y="164" class="sub">How staff access the office tools and keep shared records up to date</text>

  <!-- Sign-in flow -->
  <text x="96" y="218" class="step">01  ·  SIGN IN</text>
  <g filter="url(#shadow)"><rect x="92" y="240" width="340" height="118" rx="18" fill="#fff" stroke="#dbe7e9"/><rect x="92" y="240" width="8" height="118" rx="4" fill="#123b67"/></g>
  <circle cx="135" cy="284" r="22" fill="#e8f0f8"/><text x="135" y="291" text-anchor="middle" font-size="20" fill="#123b67">1</text>
  <text x="171" y="281" class="cardTitle">Staff login</text><text x="171" y="309" class="body">Enter account and password</text><text x="171" y="333" class="small">AIRCON G.O.D login page</text>

  <path d="M442 299 H578" fill="none" stroke="#6a8794" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="590" y="240" width="390" height="118" rx="18" fill="#fff" stroke="#dbe7e9"/><rect x="590" y="240" width="8" height="118" rx="4" fill="#3c91a3"/></g>
  <circle cx="633" cy="284" r="22" fill="#e6f5f6"/><text x="633" y="291" text-anchor="middle" font-size="20" fill="#287c8c">2</text>
  <text x="669" y="281" class="cardTitle">Check account</text><text x="669" y="309" class="body">Supabase verifies credentials</text><text x="669" y="333" class="small">Staff profile and role are loaded</text>

  <path d="M990 299 H1126" fill="none" stroke="#6a8794" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1138" y="240" width="370" height="118" rx="18" fill="url(#navy)"/></g>
  <circle cx="1182" cy="284" r="22" fill="#ffffff" opacity=".18"/><text x="1182" y="291" text-anchor="middle" font-size="20" class="white">3</text>
  <text x="1218" y="281" class="cardTitle white">Dashboard</text><text x="1218" y="309" font-size="15" fill="#e2f2f3">Choose an office work area</text><text x="1218" y="333" font-size="13" fill="#c8dede">Role-based staff workflow</text>

  <!-- Work areas -->
  <text x="96" y="416" class="step">02  ·  OFFICE WORK AREAS</text>
  <text x="1508" y="416" text-anchor="end" class="small">Select a section from the dashboard</text>
  <rect x="92" y="440" width="1416" height="350" rx="22" fill="#f8fbfb" stroke="#d9e6e7" stroke-width="1.5"/>
  <path d="M1323 358 V402 H800 V430" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <g>
    <rect x="126" y="478" width="414" height="82" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="163" cy="519" r="18" fill="#e2f3ef"/><text x="163" y="525" text-anchor="middle" font-size="17" fill="#0f766e">▦</text><text x="195" y="515" class="module">Inventory &amp; Scanner</text><text x="195" y="538" class="moduleSub">Stock levels, scans and movements</text>
    <rect x="593" y="478" width="414" height="82" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="630" cy="519" r="18" fill="#e7eef8"/><text x="630" y="525" text-anchor="middle" font-size="17" fill="#315d91">₱</text><text x="662" y="515" class="module">Price List &amp; Purchase</text><text x="662" y="538" class="moduleSub">Pricing, orders and job orders</text>
    <rect x="1060" y="478" width="414" height="82" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="1097" cy="519" r="18" fill="#fff1df"/><text x="1097" y="525" text-anchor="middle" font-size="17" fill="#a36216">⌂</text><text x="1129" y="515" class="module">Customer Records</text><text x="1129" y="538" class="moduleSub">Customers, receipts and form requests</text>

    <rect x="126" y="584" width="414" height="82" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="163" cy="625" r="18" fill="#e8f4e8"/><text x="163" y="631" text-anchor="middle" font-size="17" fill="#42824f">▣</text><text x="195" y="621" class="module">Weekly &amp; Daily Schedule</text><text x="195" y="644" class="moduleSub">Plan work, assign teams, update job status</text>
    <rect x="593" y="584" width="414" height="82" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="630" cy="625" r="18" fill="#f2eafa"/><text x="630" y="631" text-anchor="middle" font-size="17" fill="#7950a0">✓</text><text x="662" y="621" class="module">Warranty &amp; Quotation</text><text x="662" y="644" class="moduleSub">After-sales details and quotations</text>
    <rect x="1060" y="584" width="414" height="82" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="1097" cy="625" r="18" fill="#e6f5f6"/><text x="1097" y="631" text-anchor="middle" font-size="17" fill="#287c8c">#</text><text x="1129" y="621" class="module">Serial Number Tracking</text><text x="1129" y="644" class="moduleSub">Track equipment by serial number</text>

    <rect x="126" y="690" width="414" height="72" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="163" cy="726" r="18" fill="#fff1df"/><text x="163" y="732" text-anchor="middle" font-size="17" fill="#a36216">♙</text><text x="195" y="722" class="module">Staff</text><text x="195" y="744" class="moduleSub">Staff details and roles</text>
    <rect x="593" y="690" width="414" height="72" rx="14" fill="#fff" stroke="#dce7e9"/><circle cx="630" cy="726" r="18" fill="#e7eef8"/><text x="630" y="732" text-anchor="middle" font-size="17" fill="#315d91">•••</text><text x="662" y="722" class="module">Office Chat</text><text x="662" y="744" class="moduleSub">Team messages (database setup required)</text>
    <rect x="1060" y="690" width="414" height="72" rx="14" fill="#f2f8f7" stroke="#bcded8" stroke-dasharray="5 5"/><circle cx="1097" cy="726" r="18" fill="#dff1ec"/><text x="1097" y="732" text-anchor="middle" font-size="17" fill="#0f766e">↗</text><text x="1129" y="722" class="module">Installation Form</text><text x="1129" y="744" class="moduleSub">Separate form sends requests to Customer Records</text>
  </g>

  <!-- Shared records -->
  <text x="96" y="848" class="step">03  ·  SHARED RECORDS</text>
  <path d="M800 790 V858" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <g filter="url(#shadow)"><rect x="250" y="880" width="430" height="145" rx="20" fill="#fff" stroke="#dce7e9"/><rect x="920" y="880" width="430" height="145" rx="20" fill="url(#navy)"/></g>
  <circle cx="300" cy="930" r="24" fill="#e2f3ef"/><text x="300" y="937" text-anchor="middle" font-size="20" fill="#0f766e">✓</text>
  <text x="342" y="924" class="cardTitle">Save an update</text><text x="342" y="953" class="body">Work area saves operational records</text><text x="342" y="980" class="small">Inventory · schedules · customers · orders</text>
  <path d="M692 952 H897" fill="none" stroke="#6a8794" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="970" cy="930" r="24" fill="#fff" opacity=".18"/><text x="970" y="937" text-anchor="middle" font-size="20" class="white">☁</text>
  <text x="1012" y="924" class="cardTitle white">Supabase database</text><text x="1012" y="953" font-size="15" fill="#e2f2f3">Shared data syncs for other staff</text><text x="1012" y="980" font-size="13" fill="#c8dede">Database permissions protect records</text>
  <path d="M1135 1038 V1080 H465 V1038" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>
  <rect x="585" y="1059" width="430" height="42" rx="21" fill="#e1f2ee"/><text x="800" y="1086" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Updates return to the dashboard and shared work areas</text>
  <text x="800" y="1153" text-anchor="middle" class="small">AIRCON G.O.D · Office workflow overview</text>
</svg>
